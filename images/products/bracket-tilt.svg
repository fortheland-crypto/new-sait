<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="railMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hookMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowTilt" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Широкая настенная горизонтальная планка-рейка -->
  <g filter="url(#shadowTilt)">
    <rect x="40" y="160" width="320" height="80" rx="8" fill="url(#railMetal)" stroke="#64748b" stroke-width="2"/>
    
    <!-- Перфорация и отверстия под монтаж на стену -->
    <rect x="60" y="195" width="280" height="10" rx="5" fill="#f8fafc" opacity="0.9"/>
    
    <circle cx="70" cy="180" r="4" fill="#f8fafc"/>
    <circle cx="100" cy="180" r="4" fill="#f8fafc"/>
    <circle cx="300" cy="180" r="4" fill="#f8fafc"/>
    <circle cx="330" cy="180" r="4" fill="#f8fafc"/>

    <!-- Встроенный жидкостный уровень (зеленый пузырек) -->
    <rect x="180" y="172" width="40" height="16" rx="8" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
    <circle cx="200" cy="180" r="4" fill="#a7f3d0"/>
  </g>

  <!-- Левая вертикальная направляющая (кронштейн на ТВ) -->
  <g filter="url(#shadowTilt)">
    <!-- Крюк зацепления сверху -->
    <path d="M 110 80 C 110 70, 135 70, 135 80 L 135 320 C 135 325, 110 325, 110 320 Z" fill="url(#hookMetal)" stroke="#64748b" stroke-width="1.5"/>
    <!-- Отверстия под болты VESA -->
    <circle cx="122" cy="100" r="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="122" cy="130" r="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="122" cy="270" r="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="122" cy="300" r="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <!-- Барашек/винт наклона -->
    <circle cx="140" cy="140" r="7" fill="#ef4444"/>
    <!-- Шнурок автофиксации замка снизу -->
    <line x1="122" y1="320" x2="122" y2="350" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3,2"/>
    <circle cx="122" cy="355" r="5" fill="#ef4444"/>
  </g>

  <!-- Правая вертикальная направляющая (кронштейн на ТВ) -->
  <g filter="url(#shadowTilt)">
    <!-- Крюк зацепления сверху -->
    <path d="M 265 80 C 265 70, 290 70, 290 80 L 290 320 C 290 325, 265 325, 265 320 Z" fill="url(#hookMetal)" stroke="#64748b" stroke-width="1.5"/>
    <!-- Отверстия под болты VESA -->
    <circle cx="277" cy="100" r="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="277" cy="130" r="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="277" cy="270" r="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="277" cy="300" r="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <!-- Барашек/винт наклона -->
    <circle cx="295" cy="140" r="7" fill="#ef4444"/>
    <!-- Шнурок автофиксации замка снизу -->
    <line x1="277" y1="320" x2="277" y2="350" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3,2"/>
    <circle cx="277" cy="355" r="5" fill="#ef4444"/>
  </g>

  <!-- Бейдж -->
  <rect x="95" y="20" width="210" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Наклон -15° • ТВ 32–70″ до 45 кг</text>
</svg>
