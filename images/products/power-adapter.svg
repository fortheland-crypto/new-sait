<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pinMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadowAdapter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Штепсельная вилка (евровилка) слева -->
  <g filter="url(#shadowAdapter)">
    <!-- Штыри вилки -->
    <rect x="40" y="110" width="40" height="12" rx="6" fill="url(#pinMetal)" stroke="#64748b" stroke-width="1"/>
    <rect x="40" y="150" width="40" height="12" rx="6" fill="url(#pinMetal)" stroke="#64748b" stroke-width="1"/>

    <!-- Корпус адаптера -->
    <rect x="75" y="80" width="120" height="140" rx="16" fill="url(#bodyGrad)" stroke="#475569" stroke-width="2"/>
    
    <!-- Индикатор питания (зеленый светодиод) -->
    <circle cx="165" cy="105" r="5" fill="#10b981" stroke="#059669" stroke-width="1"/>
    <circle cx="165" cy="105" r="9" fill="#10b981" opacity="0.3"/>

    <!-- Маркировка на корпусе -->
    <text x="135" y="135" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#f8fafc" text-anchor="middle">12V 2.0A</text>
    <text x="135" y="152" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">POWER ADAPTER</text>
    <text x="135" y="167" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">5.5 × 2.5 mm</text>

    <!-- Вывод провода (хвостовик) -->
    <path d="M 135 220 L 135 245 L 127 255 L 143 255 L 135 245 Z" fill="#0f172a"/>
  </g>

  <!-- Провод с петлей -->
  <path d="M 135 255 C 135 295, 230 330, 270 280 C 300 240, 260 190, 290 150 C 310 120, 340 130, 345 150" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

  <!-- Разъем питания DC 5.5 x 2.5 мм -->
  <g filter="url(#shadowAdapter)">
    <!-- Корпус штекера -->
    <rect x="330" y="150" width="22" height="60" rx="6" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Резиновый протектор -->
    <rect x="333" y="140" width="16" height="12" rx="3" fill="#0f172a"/>
    <!-- Металлическая трубка штекера -->
    <rect x="334" y="210" width="14" height="35" rx="3" fill="url(#pinMetal)" stroke="#64748b" stroke-width="1"/>
    <!-- Желтое изолирующее кольцо -->
    <rect x="334" y="240" width="14" height="6" fill="#eab308"/>
    <!-- Отверстие коннектора -->
    <circle cx="341" cy="246" r="3" fill="#0f172a"/>
  </g>

  <!-- Текстовый бейдж снизу -->
  <rect x="85" y="348" width="230" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="368" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">12V 2A • Для Отау ТВ / Телекарта / Роутеров</text>
</svg>
